<html lang="en">
<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DS Catalog Browser</title>
    <base data-trunk-public-url />

    <link data-trunk rel="copy-file" href="configuration.json" />

    <style>
        :root {
            color-scheme: light dark;
            --fg: #1b1f23;
            --bg: #ffffff;
            --muted: #57606a;
            --border: #d0d7de;
            --header-bg: #f6f8fa;
            --error: #b02a37;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e6edf3;
                --bg: #0d1117;
                --muted: #8b949e;
                --border: #30363d;
                --header-bg: #161b22;
                --error: #ff7b72;
            }
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--fg);
            background: var(--bg);
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        header h1 {
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 0;
        }

        .status {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .status-error {
            color: var(--error);
            border-color: var(--error);
        }

        table.offers {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        table.offers th,
        table.offers td {
            text-align: left;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        table.offers th {
            background: var(--header-bg);
            font-weight: 600;
        }

        tr.dataset-row td {
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
        }

        .toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            width: 1.75rem;
            height: 1.75rem;
            color: var(--fg);
        }

        .toggle-disabled {
            display: inline-block;
            width: 1.75rem;
            text-align: center;
            color: var(--muted);
        }

        ul.datasets {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        ul.datasets li {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.3rem 0;
        }

        .dataset-name {
            font-weight: 500;
        }

        .dataset-id {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
</body>
</html>
